<body>

<h1>🎵 YTMusic Scraper — Test Page</h1>

<div class="tabs">

  <div class="row">

</div>

  <div class="row">
    <input id="stream-input" placeholder="Video ID (cth: dQw4w9WgXcQ)" onkeydown="if(event.key==='Enter')doStream()">
    <button onclick="doStream()">Resolve Stream</button>
  </div>
  <div id="stream-status"></div>
  <div id="stream-player"></div>
  <pre id="stream-json" class="hidden"></pre>
</div>

<script>
// ============================================================
// AUTO-CATCH EXPIRED STREAM URL
// ============================================================
const streamCache = new Map(); // videoId -> { url, expiresAt, data }
let currentAudio = null;
let currentVideoId = null;
let expiryTimer = null;

function formatRemaining(ms) {
  if (ms <= 0) return 'EXPIRED';
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const h = Math.floor(m / 60);
  return h > 0 ? `${h}j ${m % 60}m` : `${m}m ${s % 60}s`;
}

/**
 * Cek apakah stream URL sudah expired.
 * Jika ya, auto-refresh via /api/stream.
 */
async function getValidStream(videoId, forceRefresh = false) {
  const cached = streamCache.get(videoId);

  if (!forceRefresh && cached && Date.now() < cached.expiresAt - 30000) {
    // Masih valid (>30 detik sebelum expire)
    return cached;
  }

  // Fetch baru
  setStatus('stream-status', 'warn', `⏳ Resolving stream... (${forceRefresh ? 'refresh' : 'new'})`);
  const res = await fetch(`/api/stream?videoId=${encodeURIComponent(videoId)}`);
  const json = await res.json();

  if (!json.success) throw new Error(json.error || 'Stream resolve failed');

  const entry = {
    url: json.data.bestAudio.url,
    expiresAt: json.data.expiresAt,
    data: json.data,
    videoId,
  };

  streamCache.set(videoId, entry);
  return entry;
}

/**
 * Main play function — auto-catch expired, auto-refresh.
 */
async function playVideo(videoId) {
  currentVideoId = videoId;

  try {
    const entry = await getValidStream(videoId);

    // Render player
    const el = document.getElementById('stream-player');
    el.innerHTML = `
      <div class="item">
        <img src="${entry.data.thumbnail || ''}" alt="">
        <div class="info">
          <div class="title">${entry.data.title || videoId}</div>
          <div class="sub">${entry.data.author || ''} • ${entry.data.lengthSeconds}s • client: ${entry.data.clientUsed}</div>
          <div class="sub">Expires: ${new Date(entry.expiresAt).toLocaleTimeString()} (${formatRemaining(entry.expiresAt - Date.now())})</div>
        </div>
        <button onclick="forceRefreshCurrent()">🔄 Refresh</button>
      </div>
      <div class="expiry-bar"><div class="expiry-fill" id="expiry-fill"></div></div>
      <audio id="audio-player" controls autoplay style="width:100%;margin-top:12px;" src="${entry.url}"></audio>
    `;

    currentAudio = document.getElementById('audio-player');

    // Auto-catch error (misal URL expired di tengah playback)
    currentAudio.addEventListener('error', async () => {
      console.warn('[auto-catch] Audio error — refreshing stream...');
      setStatus('stream-status', 'warn', '🔄 Stream error — auto-refreshing...');
      try {
        const fresh = await getValidStream(videoId, true);
        currentAudio.src = fresh.url;
        currentAudio.play();
        setStatus('stream-status', 'ok', `✅ Auto-refreshed. New expiry: ${new Date(fresh.expiresAt).toLocaleTimeString()}`);
      } catch (e) {
        setStatus('stream-status', 'err', `❌ Auto-refresh failed: ${e.message}`);
      }
    });

    // Timer untuk update expiry bar
    if (expiryTimer) clearInterval(expiryTimer);
    expiryTimer = setInterval(() => {
      const fill = document.getElementById('expiry-fill');
      if (!fill || !currentVideoId) return;
      const cache = streamCache.get(currentVideoId);
      if (!cache) return;
      const total = cache.data.expiresInSeconds * 1000;
      const remaining = cache.expiresAt - Date.now();
      const pct = Math.max(0, Math.min(100, (remaining / total) * 100));
      fill.style.width = pct + '%';
      fill.style.background = pct > 30 ? '#4ade80' : pct > 10 ? '#facc15' : '#f87171';

      // Auto-refresh jika <10% remaining (proactive)
      if (pct < 10 && !cache.refreshing) {
        cache.refreshing = true;
        setStatus('stream-status', 'warn', '⏳ Stream hampir expired — auto-refreshing...');
        getValidStream(currentVideoId, true).then((fresh) => {
          if (currentAudio) currentAudio.src = fresh.url;
          cache.refreshing = false;
          setStatus('stream-status', 'ok', '✅ Auto-refreshed sebelum expired.');
        }).catch((e) => {
          cache.refreshing = false;
          setStatus('stream-status', 'err', '❌ Proactive refresh gagal: ' + e.message);
        });
      }
    }, 1000);

    setStatus('stream-status', 'ok', `✅ Stream resolved via ${entry.data.clientUsed}`);
  } catch (e) {
    setStatus('stream-status', 'err', `❌ ${e.message}`);
  }
}

async function forceRefreshCurrent() {
  if (!currentVideoId) return;
  setStatus('stream-status', 'warn', '🔄 Force refresh...');
  try {
    const fresh = await getValidStream(currentVideoId, true);
    if (currentAudio) currentAudio.src = fresh.url;
    setStatus('stream-status', 'ok', `✅ Refreshed. Expires: ${new Date(fresh.expiresAt).toLocaleTimeString()}`);
  } catch (e) {
    setStatus('stream-status', 'err', `❌ ${e.message}`);
  }
}

// ============================================================
// UI HELPERS
// ============================================================
function setStatus(id, type, msg) {
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = msg ? `<div class="status ${type}">${msg}</div>` : '';
}

function renderItems(containerId, items) {
  const el = document.getElementById(containerId);
  if (!items || items.length === 0) {
    el.innerHTML = '<div class="status warn">Tidak ada item.</div>';
    return;
  }
  el.innerHTML = items.map((it) => {
    const videoId = it.videoId || (it.type === 'song' ? it.id : null);
    const playBtn = videoId
      ? `<button onclick="playAndSwitch('${videoId}')">▶️ Play</button>`
      : `<button onclick="alert('Item ini bukan song (type: ${it.type}). Gunakan browse untuk detail.')">ℹ️</button>`;
    return `
      <div class="item">
        <img src="${it.thumbnail || ''}" alt="" onerror="this.style.display='none'">
        <div class="info">
          <div class="title">${it.title || '(no title)'}</div>
          <div class="sub">${it.subtitle || it.duration || ''} ${it.type ? '['+it.type+']' : ''}</div>
        </div>
        ${playBtn}
      </div>
    `;
  }).join('');
}

// ============================================================
// TAB LOGIC
// ============================================================
document.querySelectorAll('.tab').forEach((tab) => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
    document.querySelectorAll('[id^="tab-"]').forEach((d) => d.classList.add('hidden'));
    tab.classList.add('active');
    document.getElementById('tab-' + tab.dataset.tab).classList.remove('hidden');
  });
});

// ============================================================
// HOME
// ============================================================
async function loadHome() {
  setStatus('home-status', 'warn', '⏳ Loading home feed...');
  document.getElementById('home-list').innerHTML = '';
  try {
    const res = await fetch('/api/home');
    const json = await res.json();
    if (!json.success) throw new Error(json.error);

    setStatus('home-status', 'ok', `✅ ${json.data.sections.length} sections, ${json.data.allItems.length} items`);

    const el = document.getElementById('home-list');
    el.innerHTML = json.data.sections.map((sec) => `
      <h2>${sec.title || '(untitled)'}</h2>
      ${sec.items.map((it) => {
        const vid = it.videoId || (it.type === 'song' ? it.id : null);
        const playBtn = vid ? `<button onclick="playAndSwitch('${vid}')">▶️</button>` : '';
        return `
          <div class="item">
            <img src="${it.thumbnail || ''}" alt="" onerror="this.style.display='none'">
            <div class="info">
              <div class="title">${it.title || ''}</div>
              <div class="sub">${it.subtitle || ''} [${it.type}]</div>
            </div>
            ${playBtn}
          </div>
        `;
      }).join('')}
    `).join('');
  } catch (e) {
    setStatus('home-status', 'err', `❌ ${e.message}`);
  }
}

// ============================================================
// SEARCH
// ============================================================
async function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  if (!q) return;
  setStatus('search-status', 'warn', '⏳ Searching...');
  document.getElementById('search-list').innerHTML = '';
  try {
    const res = await fetch(`/api/search?q=${encodeURIComponent(q)}&limit=20`);
    const json = await res.json();
    if (!json.success) throw new Error(json.error);
    setStatus('search-status', 'ok', `✅ ${json.count} results`);
    renderItems('search-list', json.data);
  } catch (e) {
    setStatus('search-status', 'err', `❌ ${e.message}`);
  }
}

// ============================================================
// STREAM
// ============================================================
async function doStream() {
  const vid = document.getElementById('stream-input').value.trim();
  if (!vid) return;
  await playVideo(vid);
}

// Play dari Home/Search → switch ke tab Stream
function playAndSwitch(videoId) {
  document.querySelector('.tab[data-tab="stream"]').click();
  document.getElementById('stream-input').value = videoId;
  playVideo(videoId);
}

// Init
loadHome();
</script>
</body>
